services:
  - type: web
    name: privacylens-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false        # Render will prompt you to enter this in the dashboard
      - key: ALLOWED_ORIGINS
        sync: false        # Set to: https://YOUR-USERNAME.github.io
